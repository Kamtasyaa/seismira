[workspace]
resolver = "3"
members = ["crates/seismira-core", "crates/seismira-app", "crates/seismira-data"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
seismira-core = { path = "crates/seismira-core" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Geliştirme derlemesinde bağımlılıklar optimize edilir; sayısal kod ve
# çizim debug modunda da akıcı kalır.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
