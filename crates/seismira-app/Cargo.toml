[package]
name = "seismira-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "seismira"
path = "src/main.rs"

[features]
# Geliştirme aracı: SEISMIRA_SCREENSHOT=dosya.png ile harita yüklendikten
# sonra pencerenin görüntüsünü kaydedip çıkar (bkz. src/devshot.rs).
screenshot = ["dep:image"]

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "links", "wgpu", "wayland", "x11", "persistence"] }
env_logger = "0.11.11"
fluent-bundle = "0.16"
fluent-templates = "0.15"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
log = "0.4"
memmap2 = "0.9.12"
rayon = "1"
rfd = "0.18.0"
ureq = "3.5.2"
pollster = "1"
serde_json = "1"
tiff = { version = "0.11.3", features = ["zstd"] }
toml = "1"
seismira-core.workspace = true
skrifa = "0.44"
sys-locale = "0.3"
unic-langid = "0.9"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }

# eframe'in varsayılan özellikleri sistem yazı tiplerini açtığı için kapalı.
# Onlarla birlikte winit'in varsayılanları da kapanıyordu; GNOME/Wayland'da
# Adwaita başlık çubuğu (küçült/büyüt/kapat) ve çalışma anında libwayland
# yükleme (wayland-dlopen) için burada yeniden açılır. Sürüm eframe'inkiyle
# aynı tutulmalı.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"
