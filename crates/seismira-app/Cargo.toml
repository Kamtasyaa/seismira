[package]
name = "seismira-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "seismira"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wgpu", "glow", "wayland", "x11", "persistence"] }
env_logger = "0.11.11"
fluent-templates = "0.15"
log = "0.4"
seismira-core.workspace = true
skrifa = "0.44"
sys-locale = "0.3"
unic-langid = "0.9"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }

# eframe'in varsayılan özellikleri sistem yazı tiplerini açtığı için kapalı.
# Onlarla birlikte winit'in varsayılanları da kapanıyordu; GNOME/Wayland'da
# Adwaita başlık çubuğu (küçült/büyüt/kapat) ve çalışma anında libwayland
# yükleme (wayland-dlopen) için burada yeniden açılır. Sürüm eframe'inkiyle
# aynı tutulmalı.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"
