name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Biçim (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Önce test: kullanıcıda yalnızca Linux var, Windows ve macOS'u yalnızca
      # bu adım dener. CI en yeni kararlı Rust'ı kullanır; yeni bir clippy
      # sürümünün getirdiği uyarı testleri engellemesin diye clippy sonra ve
      # test düşse de çalışır (2026-11-15: clippy 1.100 üç commit boyunca
      # testlerin hiç çalışmamasına yol açmıştı).
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Release (LTO) derlemesi CI süresini ~3 katına çıkarıyor; paketleme
      # fazında (Faz 10) ayrı bir iş olarak geri gelecek.
