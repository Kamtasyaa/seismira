# Her veri setinin kaynağı, lisansı ve atıf metni.
# Uygulamadaki "Veri Kaynakları ve Lisanslar" sayfası bu dosyadan üretilir.
# Kurallar: docs/veri.md. Lisans, veri indirilmeden önce YENİDEN kontrol edilir.
#
# Örnek kayıt biçimi:
# [[dataset]]
# id = "natural-earth-110m"
# name = "Natural Earth 1:110m"
# url = "https://www.naturalearthdata.com/"
# license = "Public Domain"
# attribution = "Made with Natural Earth."
# modified = true            # türetilmişse "değiştirildi" notu gösterilir
# license_checked = "YYYY-MM-DD"

[[dataset]]
id = "noto-fonts"
name = "Noto Sans yazı tipleri (Latin/Kiril/Yunan ve diğer yazı sistemleri)"
url = "https://github.com/notofonts/notofonts.github.io"
license = "OFL-1.1"
license_file = "assets/fonts/OFL.txt"
attribution = "Noto fonts © The Noto Project Authors, SIL Open Font License 1.1."
modified = false
license_checked = "2026-11-14"
files = "assets/fonts/*.ttf (sürüm ve SHA256: scripts/fetch_fonts.py)"

[[dataset]]
id = "noto-cjk"
name = "Noto Sans CJK (JP, KR, SC, TC; bölgesel alt küme OTF)"
url = "https://github.com/notofonts/noto-cjk"
license = "OFL-1.1"
license_file = "assets/fonts/cjk/OFL.txt"
attribution = "Noto Sans CJK © 2014-2021 Adobe, SIL Open Font License 1.1."
modified = false
license_checked = "2026-11-14"
files = "assets/fonts/cjk/*.otf (depoda değil; scripts/fetch_fonts.py ile indirilir)"

[[dataset]]
id = "natural-earth"
name = "Natural Earth v5.1.2 (kara, göller, ülke ve Admin-1 sınırları; 1:110m, 1:50m, 1:10m)"
url = "https://www.naturalearthdata.com/"
license = "Public Domain"
license_url = "https://www.naturalearthdata.com/about/terms-of-use/"
attribution = "Made with Natural Earth. Free vector and raster map data @ naturalearthdata.com."
modified = true            # Web Mercator'a izdüşüm, üçgenleme, ikili biçim
license_checked = "2026-11-14"
note = "Sınırlar Natural Earth'ün varsayılan gösterimidir; siyasi görüş bildirmez."
files = "data/map/ne_*.smap (scripts/prepare_data.py ile üretilir)"

[[dataset]]
id = "ak135-traveltimes"
name = "ak135 ilk P / ilk S seyahat süresi tablosu (kendi üretimimiz)"
url = "https://docs.obspy.org/packages/obspy.taup.html"
license = "GPL-3.0-or-later (tablo bizim üretimimiz; model yayımlanmış)"
attribution = "Kennett, B.L.N., Engdahl, E.R. & Buland, R. (1995). Constraints on seismic velocities in the Earth from traveltimes. GJI 122, 108-124. Hesap: ObsPy TauP (Krischer vd. 2015; Crotwell vd. 1999)."
modified = false
license_checked = "2026-11-14"
files = "data/traveltime/ak135.ttt, data/traveltime/ak135_check.csv (scripts/gen_traveltime.py)"

[[dataset]]
id = "geonames-cities15000"
name = "GeoNames cities15000 + admin1CodesASCII (şehirler, nüfus, il/eyalet adları)"
url = "https://download.geonames.org/export/dump/"
license = "CC-BY-4.0"
attribution = "GeoNames (www.geonames.org), CC BY 4.0."
modified = true            # alan seçimi, nüfusa göre sıralama, admin1 ad eki temizliği, ikili biçim
license_checked = "2026-11-14"
snapshot = "2026-11-14; cities15000.zip sha256 f274b5e5f2cff6211cb10cc5b348254a6e00dde9449244d18c0f542beb7581e5; admin1CodesASCII.txt sha256 2e4867f5397acb056ea26377601b57af37cb4c81399770225018e9e439e91ad3"
files = "data/cities/cities15000.scty (seismira-data geonames)"

[[dataset]]
id = "cy14-coefficients"
name = "Chiou & Youngs (2014) GMPE katsayıları"
url = "https://code.usgs.gov/ghsc/nshmp/nshmp-lib"
license = "CC0-1.0 / ABD kamu malı"
attribution = "Chiou & Youngs (2014), Earthquake Spectra 30(3). Katsayı dosyası: USGS nshmp-lib."
modified = false
license_checked = "2026-11-14"
files = "crates/seismira-core/src/gmpe/cy14.csv"

[[dataset]]
id = "usgs-shakemap-izmit1999"
name = "USGS ShakeMap, 1999 İzmit (usp0009d4z): istasyon listesi, kırılma, bilgi (yalnızca doğrulama)"
url = "https://earthquake.usgs.gov/earthquakes/eventpage/usp0009d4z"
license = "Public Domain (USGS)"
attribution = "U.S. Geological Survey, ShakeMap (atlas)."
modified = false
license_checked = "2026-11-14"
files = "data/validation/izmit1999/*"

[[dataset]]
