license = "CC0-1.0"
attribution = "U.S. Geological Survey, 2026, The U.S. Geological Survey Global Vs30 Mosaic: U.S. Geological Survey data release, doi:10.5066/P1NV6UNM. Yöntem: Heath, D.C., Wald, D.J., Worden, C.B., Thompson, E.M., Smoczyk, G.M. (2020). A Global Hybrid VS30 Map with a Topographic Slope-Based Default and Regional Map Insets. Earthquake Spectra 36(3), 1570-1584."
